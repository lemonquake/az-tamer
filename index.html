<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZ Tamer</title>
  <style>
    :root {
      --ui-bg: rgba(12, 16, 34, 0.92);
      --ui-border: #5a7bd8;
      --ui-gold: #f2c14e;
      --ui-text: #e8ecff;
      --ui-dim: #8b93b8;
      --ui-green: #5ad88a;
      --ui-red: #e85a6a;
      --ui-blue: #5ab8e8;
      --ui-purple: #b18ae8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #060810; }
    body { font-family: 'Segoe UI', 'Trebuchet MS', sans-serif; color: var(--ui-text); }
    #app { position: relative; width: 100%; height: 100%; }
    canvas.game-canvas { position: absolute; inset: 0; display: block; }

    /* ---------- generic panel ---------- */
    .panel {
      background: var(--ui-bg);
      border: 2px solid var(--ui-border);
      border-radius: 10px;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.55), 0 6px 24px rgba(0,0,0,0.6), inset 0 0 18px rgba(90,123,216,0.12);
      padding: 14px 18px;
    }
    .panel h3 { color: var(--ui-gold); letter-spacing: 1px; margin-bottom: 8px; font-size: 15px; text-transform: uppercase; }

    /* ---------- dialogue ---------- */
    #dialogue-box {
      position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
      width: min(860px, 92vw); min-height: 118px; z-index: 75; display: none;
    }
    #dialogue-speaker {
      position: absolute; top: -16px; left: 18px; background: var(--ui-border); color: #0c1022;
      font-weight: 700; padding: 3px 14px; border-radius: 6px; font-size: 14px; letter-spacing: 0.5px;
    }
    #dialogue-text { font-size: 17px; line-height: 1.55; min-height: 54px; padding-top: 6px; white-space: pre-wrap; }
    #dialogue-next { position: absolute; right: 16px; bottom: 8px; color: var(--ui-gold); animation: bob 0.8s infinite; font-size: 14px; }
    @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(4px);} }
    #dialogue-choices { display: none; flex-direction: column; gap: 6px; margin-top: 8px; }

    .choice-btn, .ui-btn {
      background: rgba(90,123,216,0.15); border: 1px solid var(--ui-border); color: var(--ui-text);
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 15px; text-align: left;
      transition: background 0.12s, transform 0.08s; font-family: inherit;
    }
    .choice-btn:hover, .ui-btn:hover, .choice-btn.kb-focus { background: rgba(242,193,78,0.25); border-color: var(--ui-gold); }
    .choice-btn:active, .ui-btn:active { transform: scale(0.98); }
    .ui-btn:disabled { opacity: 0.35; cursor: default; }
    .ui-btn.danger { border-color: var(--ui-red); }
    .ui-btn.primary { border-color: var(--ui-gold); background: rgba(242,193,78,0.18); }

    /* ---------- HUD ---------- */
    #hud { position: absolute; top: 12px; left: 12px; z-index: 30; display: none; min-width: 230px; font-size: 14px; pointer-events: none; }
    #hud .hud-portrait, #hud .hud-chip { pointer-events: auto; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s; }
    #hud .hud-portrait:hover { transform: scale(1.06); box-shadow: 0 0 10px rgba(242,193,78,0.6); }
    #hud .hud-chip:hover { border-color: var(--ui-gold); box-shadow: 0 0 8px rgba(242,193,78,0.35); }
    #hud .row { display: flex; justify-content: space-between; gap: 18px; padding: 1px 0; }
    #hud .label { color: var(--ui-dim); }
    #hud-zone { color: var(--ui-gold); font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
    .bar { height: 10px; background: #1a2040; border-radius: 5px; overflow: hidden; margin: 2px 0 4px; border: 1px solid #2c3666; }
    .bar > div { height: 100%; border-radius: 4px; transition: width 0.25s; }
    .bar.hull > div { background: linear-gradient(90deg, #e85a6a, #f2935a); }
    .bar.energy > div { background: linear-gradient(90deg, #5ab8e8, #5ad88a); }

    #minimap { position: absolute; top: 12px; right: 12px; z-index: 30; display: none; image-rendering: pixelated; border: 2px solid var(--ui-border); border-radius: 8px; background: rgba(6,8,16,0.85); }

    /* ---------- large transparent dungeon map (M) ---------- */
    #bigmap {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 40; display: none; pointer-events: none;
      animation: bigmapIn 0.22s ease-out;
    }
    @keyframes bigmapIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    #bigmap canvas {
      width: min(68vmin, 640px); height: min(68vmin, 640px);
      border: 2px solid rgba(90,123,216,0.65); border-radius: 14px;
      box-shadow: 0 0 40px rgba(0,0,0,0.55);
    }
    #bigmap .bigmap-hint {
      text-align: center; margin-top: 6px; font-size: 13px; color: var(--ui-dim);
      text-shadow: 0 1px 4px #000; letter-spacing: 1px;
    }
    #bigmap .bigmap-hint b { color: var(--ui-gold); }

    /* ---------- HUD party chips & hotkey legend ---------- */
    .hud-party { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
    .hud-chip { background: rgba(26,32,64,0.6); border: 1px solid #2c3666; border-radius: 7px; padding: 5px 8px; }
    .hud-chip .nm { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; }
    #hotkeys {
      position: absolute; bottom: 14px; right: 14px; z-index: 28; display: none; gap: 12px;
      background: var(--ui-bg); border: 1px solid #2c3666; border-radius: 18px; padding: 6px 16px;
      font-size: 13px; color: var(--ui-dim); pointer-events: none;
    }
    #hotkeys b { color: var(--ui-gold); }
    .panel-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .panel-tabs .tab { flex: 1; text-align: center; font-size: 14px; padding: 7px 8px; }
    .hub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hub-grid .ui-btn { font-size: 16px; padding: 14px; text-align: center; }

    /* ---------- overworld expedition intel ---------- */
    #ow-panel {
      position: absolute; right: 18px; top: 50%; width: 330px; z-index: 32;
      transform: translate(130%, -50%); transition: transform 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      pointer-events: none;
    }
    #ow-panel.show { transform: translate(0, -50%); }
    #ow-panel .row { display: flex; justify-content: space-between; padding: 2px 0; }
    #ow-panel.quest { border-color: var(--ui-red); animation: questGlow 1.6s infinite; }
    @keyframes questGlow {
      0%, 100% { box-shadow: 0 0 8px rgba(232,58,90,0.35), inset 0 0 14px rgba(232,58,90,0.1); }
      50% { box-shadow: 0 0 30px rgba(232,58,90,0.85), inset 0 0 22px rgba(232,58,90,0.25); }
    }
    .quest-badge {
      display: inline-block; background: var(--ui-red); color: #fff; font-weight: 800; font-size: 12px;
      letter-spacing: 2px; padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
      animation: badgePulse 1.6s infinite;
    }
    @keyframes badgePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .enemy-chip {
      display: inline-block; padding: 2px 10px; border-radius: 10px; border: 1px solid #2c3666;
      margin: 2px; font-size: 12px; font-weight: 600; background: rgba(26,32,64,0.5);
    }
    .enemy-chip.unknown { color: var(--ui-dim); border-style: dashed; letter-spacing: 2px; }

    #interact-hint {
      position: absolute; left: 50%; bottom: 130px; transform: translateX(-50%); z-index: 25; display: none;
      background: var(--ui-bg); border: 1px solid var(--ui-gold); padding: 6px 18px; border-radius: 20px; font-size: 15px;
    }
    #interact-hint b { color: var(--ui-gold); }

    /* ---------- toast log ---------- */
    #toast-wrap { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
    .toast { background: var(--ui-bg); border: 1px solid var(--ui-border); padding: 7px 20px; border-radius: 20px; font-size: 15px; animation: toastIn 0.25s; }
    .toast.gold { border-color: var(--ui-gold); color: var(--ui-gold); }
    .toast.red { border-color: var(--ui-red); color: var(--ui-red); }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px);} to { opacity: 1; transform: none;} }

    /* ---------- full screens (menus / shop) ---------- */
    .screen {
      position: absolute; inset: 0; z-index: 50; display: none;
      background: rgba(4,6,14,0.78); backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
    }
    .screen .inner { width: min(940px, 94vw); max-height: 90vh; overflow-y: auto; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .list-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 8px 12px; border: 1px solid #2c3666; border-radius: 8px; margin-bottom: 6px;
      background: rgba(26,32,64,0.5); cursor: pointer; transition: border-color 0.12s;
    }
    .list-row:hover { border-color: var(--ui-gold); }
    .list-row .sub { color: var(--ui-dim); font-size: 13px; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; letter-spacing: 0.5px; }

    /* ---------- battle UI ---------- */
    #battle-ui { position: absolute; inset: 0; z-index: 35; display: none; pointer-events: none; }
    #battle-log {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      width: min(640px, 90vw); text-align: center; font-size: 17px; min-height: 30px;
      text-shadow: 0 2px 6px #000; font-weight: 600;
    }
    #battle-menu { position: absolute; bottom: 18px; left: 18px; width: 290px; pointer-events: all; display: none; }
    #battle-menu .ui-btn { display: block; width: 100%; margin-bottom: 5px; }
    #battle-parties { position: absolute; bottom: 18px; right: 18px; width: 285px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
    .unit-card { background: var(--ui-bg); border: 1px solid #2c3666; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    .unit-card.active { border-color: var(--ui-gold); box-shadow: 0 0 10px rgba(242,193,78,0.35); }
    .unit-card.dead { opacity: 0.4; }
    .unit-card .nm { font-weight: 700; display: flex; justify-content: space-between; }
    .minibar { height: 6px; background: #1a2040; border-radius: 3px; overflow: hidden; margin-top: 3px; }
    .minibar > div { height: 100%; transition: width 0.3s; }
    .minibar.hp > div { background: var(--ui-green); }
    .minibar.sp > div { background: var(--ui-blue); }

    /* ---------- title ---------- */
    #title-screen { position: absolute; inset: 0; z-index: 70; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      background: radial-gradient(ellipse at 50% 30%, #16204a 0%, #060810 70%); }
    #title-screen h1 {
      font-size: 76px; letter-spacing: 10px; color: var(--ui-gold);
      text-shadow: 0 0 30px rgba(242,193,78,0.5), 0 4px 0 #7a5a10; font-family: Georgia, serif;
    }
    #title-screen .subtitle { color: var(--ui-dim); font-size: 17px; letter-spacing: 3px; margin-top: -18px; }
    #title-screen .credit { position: absolute; bottom: 22px; color: var(--ui-dim); font-size: 13px; letter-spacing: 1px; }
    #title-menu { display: flex; flex-direction: column; gap: 10px; width: 280px; }
    #title-menu .ui-btn { text-align: center; font-size: 17px; padding: 12px; }

    /* ---------- name input ---------- */
    #name-modal { z-index: 80; }
    #name-modal input {
      width: 100%; font-size: 22px; padding: 10px 14px; background: #11162e; color: var(--ui-gold);
      border: 2px solid var(--ui-border); border-radius: 8px; outline: none; text-align: center; letter-spacing: 2px; font-family: inherit;
    }
    #name-modal input:focus { border-color: var(--ui-gold); }

    /* ---------- screen fade ---------- */
    #fader { position: absolute; inset: 0; background: #000; z-index: 65; pointer-events: none; opacity: 0; transition: opacity 0.45s; }
    #fader.on { opacity: 1; pointer-events: all; }

    /* ---------- HUD identity (portrait always visible) ---------- */
    .hud-id { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
    .hud-portrait {
      width: 46px; height: 46px; border-radius: 8px; object-fit: cover;
      border: 2px solid var(--ui-border); background: #11162e; flex-shrink: 0;
    }
    .hud-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-rank { display: flex; align-items: center; gap: 4px; color: var(--ui-dim); font-size: 12px; }
    .hud-rank img { width: 15px; height: 15px; }
    .panel-portrait {
      width: 86px; height: 86px; border-radius: 10px; object-fit: cover;
      border: 2px solid var(--ui-border); background: #11162e; flex-shrink: 0;
    }

    /* ---------- quest journal ---------- */
    .quest-row.ready { border-color: var(--ui-gold); box-shadow: 0 0 10px rgba(242,193,78,0.25); }
    .quest-row.done { opacity: 0.62; }
    .quest-row.locked { opacity: 0.45; }

    /* ---------- guild card viewer ---------- */
    #gcard-overlay {
      position: absolute; inset: 0; z-index: 90; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(20,24,48,0.96) 0%, rgba(4,5,12,0.985) 75%);
      animation: gcardIn 0.45s;
    }
    @keyframes gcardIn { from { opacity: 0; } to { opacity: 1; } }
    #gcard-canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
    #gcard-canvas:active { cursor: grabbing; }
    #gcard-head { position: absolute; top: 26px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
    #gcard-title { font-family: Georgia, serif; font-size: 34px; letter-spacing: 8px; font-weight: 700; text-shadow: 0 0 24px rgba(242,193,78,0.35), 0 2px 6px #000; }
    #gcard-sub { color: var(--ui-dim); font-size: 14px; letter-spacing: 2px; margin-top: 6px; }
    #gcard-hint { position: absolute; bottom: 86px; left: 0; right: 0; text-align: center; color: var(--ui-dim); font-size: 13px; letter-spacing: 1px; pointer-events: none; z-index: 2; }
    #gcard-lore {
      position: absolute; left: 26px; bottom: 26px; width: 290px; z-index: 2; pointer-events: none;
      background: rgba(8,10,22,0.8); border: 1px solid #2c3666; border-radius: 10px; padding: 12px 14px;
      font-size: 13px; line-height: 1.5; color: var(--ui-text);
    }
    #gcard-actions { position: absolute; right: 26px; bottom: 26px; display: flex; gap: 10px; z-index: 2; }

    /* ---------- evolution atlas ---------- */
    .evo-scroll { max-height: 64vh; overflow-y: auto; padding-right: 6px; }
    .evo-type-head {
      font-weight: 800; letter-spacing: 3px; font-size: 13px; margin: 14px 0 8px;
      border-left: 4px solid; padding-left: 10px; text-transform: uppercase;
    }
    .evo-chain {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      background: rgba(26,32,64,0.35); border: 1px solid #232a52; border-radius: 10px;
      padding: 8px 10px; margin-bottom: 8px;
    }
    .evo-node {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 8px; border-radius: 10px; cursor: pointer; transition: background 0.12s, transform 0.1s;
    }
    .evo-node:hover { background: rgba(242,193,78,0.12); transform: translateY(-2px); }
    .evo-thumb {
      position: relative; width: 72px; height: 72px; border-radius: 10px;
      border: 2px solid; background: radial-gradient(ellipse at 50% 35%, #1a2040 0%, #0a0d1c 80%);
      overflow: hidden;
    }
    .evo-thumb img { width: 100%; height: 100%; display: block; }
    .evo-node.owned .evo-thumb { box-shadow: 0 0 12px rgba(242,193,78,0.55); }
    .evo-owned-pip {
      position: absolute; right: 2px; bottom: 2px; background: var(--ui-gold); color: #0c1022;
      font-size: 11px; font-weight: 900; border-radius: 8px; padding: 0 5px;
    }
    .evo-name { font-size: 12px; font-weight: 700; }
    .evo-stage { font-size: 10px; color: var(--ui-dim); }
    .evo-arrow {
      display: flex; flex-direction: column; align-items: center; color: var(--ui-dim);
      font-size: 15px; padding: 0 2px; line-height: 1;
    }
    .evo-arrow span { font-size: 9px; color: var(--ui-gold); margin-bottom: 1px; }

    /* ---------- elements ---------- */
    .el-chip {
      display: inline-block; border: 1px solid; border-radius: 9px; padding: 1px 7px;
      font-weight: 700; letter-spacing: 0.4px; margin: 0 2px; vertical-align: middle; white-space: nowrap;
    }
    .evo-els { font-size: 10px; letter-spacing: 1px; }
    .el-details { margin-bottom: 10px; }
    .el-details summary {
      cursor: pointer; color: var(--ui-gold); font-size: 13px; padding: 6px 10px;
      background: rgba(26,32,64,0.5); border: 1px solid #2c3666; border-radius: 8px;
    }
    .el-details summary:hover { border-color: var(--ui-gold); }
    .el-table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: 12px; }
    .el-table th, .el-table td { border: 1px solid #232a52; padding: 3px 4px; text-align: center; }
    .el-table th { font-size: 13px; background: rgba(26,32,64,0.6); }

    /* ---------- achievements ---------- */
    .ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 6px; }
    .ach-row {
      display: flex; align-items: center; gap: 8px; padding: 7px 9px;
      border: 1px solid #232a52; border-radius: 8px; background: rgba(26,32,64,0.4);
      opacity: 0.45; filter: grayscale(0.7);
    }
    .ach-row.got { opacity: 1; filter: none; border-color: rgba(242,193,78,0.55); box-shadow: 0 0 8px rgba(242,193,78,0.18); }
    .ach-icon { font-size: 20px; }
    .ach-body { display: flex; flex-direction: column; font-size: 12px; min-width: 0; }
    .ach-body .sub { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ---------- guardian card viewer ---------- */
    #pcard-overlay {
      position: absolute; inset: 0; z-index: 91; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(16,24,40,0.96) 0%, rgba(4,5,12,0.985) 75%);
      animation: gcardIn 0.45s;
    }
    #pcard-canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
    #pcard-canvas:active { cursor: grabbing; }
    #pcard-head { position: absolute; top: 26px; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 2; }
    #pcard-title { font-family: Georgia, serif; font-size: 34px; letter-spacing: 8px; font-weight: 700; text-shadow: 0 0 24px rgba(255,255,255,0.25), 0 2px 6px #000; }
    #pcard-sub { color: var(--ui-dim); font-size: 14px; letter-spacing: 2px; margin-top: 6px; }
    #pcard-hint { position: absolute; bottom: 86px; left: 0; right: 0; text-align: center; color: var(--ui-dim); font-size: 13px; letter-spacing: 1px; pointer-events: none; z-index: 2; }
    #pcard-actions { position: absolute; right: 26px; bottom: 26px; display: flex; gap: 10px; z-index: 2; }

    /* ---------- universal rank badges (shiny, animated) ---------- */
    .rank-badge {
      position: relative; display: inline-block; vertical-align: middle;
      border-radius: 50%; overflow: hidden; flex-shrink: 0;
    }
    .rank-badge img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 3px rgba(255,255,255,0.18)); }
    .rank-badge::after {
      content: ''; position: absolute; top: -60%; left: -110%; width: 55%; height: 220%;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.85), transparent);
      transform: rotate(18deg); animation: badgeShine 2.8s ease-in-out infinite;
    }
    @keyframes badgeShine { 0% { left: -110%; } 45% { left: 160%; } 100% { left: 160%; } }
    .rank-badge.grandchief img { animation: rubyPulse 1.8s ease-in-out infinite; }
    .rank-badge.grandchief::before {
      content: '✦'; position: absolute; top: -2px; right: -1px; font-size: 45%; color: #ffd2d8;
      text-shadow: 0 0 6px #ff4a5e; animation: rubySpark 1.4s ease-in-out infinite; z-index: 2;
    }
    @keyframes rubyPulse {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(232,36,58,0.55)); }
      50% { filter: drop-shadow(0 0 9px rgba(255,80,100,0.95)); }
    }
    @keyframes rubySpark {
      0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.25) rotate(40deg); }
    }
    .rank-ladder-row { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 6px; }
    .rank-ladder-row.here { background: rgba(242,193,78,0.12); border: 1px solid rgba(242,193,78,0.4); }
    .rank-progress { height: 8px; background: #1a2040; border: 1px solid #2c3666; border-radius: 4px; overflow: hidden; margin: 4px 0 8px; }
    .rank-progress > div { height: 100%; background: linear-gradient(90deg, var(--ui-gold), #ffe9a8); transition: width 0.3s; }

    .hpcol { color: var(--ui-green); } .spcol { color: var(--ui-blue); } .goldcol { color: var(--ui-gold); }
    ::-webkit-scrollbar { width: 9px; } ::-webkit-scrollbar-thumb { background: #2c3666; border-radius: 5px; }

    /* ---------- background story box ---------- */
    #story-box {
      position: absolute; right: 18px; bottom: 80px; width: 320px; z-index: 75; display: none;
      border-color: var(--ui-purple); background: rgba(12, 10, 34, 0.95);
      box-shadow: 0 0 10px rgba(177, 138, 232, 0.3); transition: bottom 0.3s ease;
      pointer-events: none;
    }
    #story-box.in-battle { bottom: 220px; }
    #story-speaker { color: var(--ui-purple); font-weight: 700; font-size: 14px; margin-bottom: 4px; letter-spacing: 0.5px; }
    #story-text { font-size: 13px; line-height: 1.45; color: var(--ui-text); }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud" class="panel"></div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="bigmap">
      <canvas id="bigmap-canvas" width="640" height="640"></canvas>
      <div class="bigmap-hint">press <b>M</b> to close the map — you can keep moving while it is open</div>
    </div>
    <div id="interact-hint"></div>
    <div id="hotkeys"></div>
    <div id="ow-panel" class="panel"></div>
    <div id="toast-wrap"></div>

    <div id="battle-ui">
      <div id="battle-log"></div>
      <div id="battle-menu" class="panel"></div>
      <div id="battle-parties"></div>
    </div>

    <div id="dialogue-box" class="panel">
      <div id="dialogue-speaker"></div>
      <div id="dialogue-text"></div>
      <div id="dialogue-next">▼</div>
      <div id="dialogue-choices"></div>
    </div>

    <div id="story-box" class="panel">
      <div id="story-speaker"></div>
      <div id="story-text"></div>
    </div>

    <div id="menu-screen" class="screen"><div class="inner panel" id="menu-content"></div></div>

    <div id="name-modal" class="screen">
      <div class="panel" style="width:420px">
        <h3 id="name-modal-title">Enter your name</h3>
        <input id="name-input" maxlength="12" autocomplete="off" spellcheck="false" />
        <div style="display:flex;justify-content:flex-end;margin-top:12px">
          <button class="ui-btn primary" id="name-confirm">Confirm</button>
        </div>
      </div>
    </div>

    <div id="title-screen">
      <h1>AZ TAMER</h1>
      <div class="subtitle">GUARDIANS OF THE SUNDERED DEPTHS</div>
      <div id="title-menu"></div>
      <div class="credit">© Aljay Leodones — AZ Tamer</div>
    </div>

    <div id="fader"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
